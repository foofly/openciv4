name: source distribution audit

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check-published-files:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Check source trees and reachable history for game files
        run: python3 tools/check_distribution.py --all-history
